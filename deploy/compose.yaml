# BSKG Compose stack: exactly three services (Requirement 24.1).
# Run from this directory on the AWS host: docker compose build && docker compose up -d
# Memory profile: 8 GB host (t4g.large) by default; see .env.16gb for 16 GB.
name: bskg

services:
  neo4j:
    # Index digest of the arm64 and amd64 image, official Docker Hub image, latest Community release on 2026-11-21.
    image: neo4j:2026.10.2-community@sha256:88458a76de0704f543bab66b7df1984b36ac3f24de3c2e2d74c8fa1972ebb8cf
    platform: linux/arm64
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-2500m}
      # Runaway queries fail instead of OOM-killing the JVM.
      NEO4J_dbms_memory_transaction_total_max: 1g
      # Browser port off; Bolt only.
      NEO4J_server_http_enabled: "false"
    volumes:
      - neo4j_data:/data
    mem_limit: ${NEO4J_MEM_LIMIT:-5632m}
    # No "ports:" entry: 7687 and 7474 are never published (Requirement 24.5).
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 10

  bskg-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bskg:local
    platform: linux/arm64
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      GOMEMLIMIT: 600MiB
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bskg", "worker", "--healthcheck"]
      start_period: 30s
      interval: 30s
      retries: 5

  bskg-api:
    image: bskg:local
    platform: linux/arm64
    command: ["serve"]
    restart: unless-stopped
    env_file: .env
    environment:
      GOMEMLIMIT: 300MiB
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bskg", "serve", "--healthcheck"]
      start_period: 10s
      interval: 10s
      retries: 6

volumes:
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # The EBS data volume is mounted at /data by infra/user_data.sh.tpl.
      device: /data/neo4j
